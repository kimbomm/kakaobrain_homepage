stages:
  - init
  - build

variables:
  SUDO_PASSWORD: "asdlkj123!"  # 비밀번호를 환경 변수로 설정

build-down-job:
  stage: init
  script:
    - echo "$SUDO_PASSWORD" | sudo -S docker-compose down  # -S 옵션 사용
  only:
    - master
  tags:
    - prod

build-up-job:
  stage: build
  script:
    - echo "$SUDO_PASSWORD" | sudo -S docker-compose up -d --build  # -S 옵션 사용
  only:
    - master
  tags:
    - prod
