stages:
  - init
  - build

build-down-job:
  stage: init
  script:
    - docker-compose down
  only:
    - release/main
  tags:
    - prod

build-up-job:
  stage: build
  before_script:
    - docker-compose down
  script:
    - docker-compose up -d --build
  only:
    - release/main
  tags:
    - prod
